name: Daily Ticket Fetch and Analysis

on:
  schedule:
    - cron: '30 0 * * *' # 每天台灣時間 08:30 自動跑
  workflow_dispatch: # 讓你可以隨時點按鈕測試

jobs:
  run_all_scripts:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 設定 Python 搜尋路徑，確保能讀取當前目錄與任何自訂套件資料夾
    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$PYTHONPATH:${{ github.workspace }}" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        pip install selectolax fast_flights typing_extensions numpy pandas matplotlib
        pip install -r requirements.txt || echo "No requirements.txt or no need"

    - name: Run Fetch Script
      run: bash run_daily.sh

    - name: Run Analysis Script
      run: python analyse_panel.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        if git diff --staged --quiet; then
          echo "No changes"
        else
          git commit -m "chore: auto fetch & analysis $(date +'%Y-%m-%d')"
          git push
        fi
