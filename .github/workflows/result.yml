name: Run Analyse Panel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允許在 GitHub Actions 頁面上點擊按鈕手動觸發

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: 取得專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝所需套件
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 執行分析腳本
      run: python analyse_panel.py
      run: python run_daily.sh
